name: RPMDB Ownership Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/diagnose-rpmdb

permissions:
  contents: read
  packages: read

env:
  BASE_IMAGE: quay.io/fedora-ostree-desktops/silverblue:44@sha256:cff5f9468fda0771bd06d8a156766c3a2079c6a56208bfedc107c4fc3421623f

jobs:
  pinned-base:
    name: Verify pinned Silverblue RPMDB
    runs-on: ubuntu-latest
    steps:
      - uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
      - name: Pull exact base and verify RPMDB
        shell: bash
        run: |
          set -euo pipefail
          podman pull "${BASE_IMAGE}"
          podman run --rm --entrypoint /usr/bin/rpmdb "${BASE_IMAGE}" --verifydb
          podman run --rm --entrypoint /usr/bin/rpm "${BASE_IMAGE}" -qa >/dev/null

  base-common:
    name: Verify Bluefin base-common RPMDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: projectbluefin/actions/bootc-build/setup-runner@v1
        with:
          storage-backend: remove-software
      - name: Build base-common without cache reads
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          common_image=$(yq -r '.images[] | select(.name == "common") | .image' image-versions.yml)
          common_sha=$(yq -r '.images[] | select(.name == "common") | .digest' image-versions.yml)
          brew_image=$(yq -r '.images[] | select(.name == "brew") | .image' image-versions.yml)
          brew_sha=$(yq -r '.images[] | select(.name == "brew") | .digest' image-versions.yml)
          akmods_flavor=main
          fedora_version=44
          kernel_release=$(skopeo inspect --retry-times 3 \
            "docker://ghcr.io/ublue-os/akmods:${akmods_flavor}-${fedora_version}" \
            | jq -r '.Labels["ostree.linux"]')
          test -n "${kernel_release}" && test "${kernel_release}" != "null"
          podman build --no-cache --target base-common \
            --build-arg BASE_IMAGE_REF="${BASE_IMAGE}" \
            --build-arg COMMON_IMAGE="${common_image}" \
            --build-arg COMMON_IMAGE_SHA="${common_sha}" \
            --build-arg BREW_IMAGE="${brew_image}" \
            --build-arg BREW_IMAGE_SHA="${brew_sha}" \
            --build-arg AKMODS_FLAVOR="${akmods_flavor}" \
            --build-arg FEDORA_MAJOR_VERSION="${fedora_version}" \
            --build-arg IMAGE_NAME=bluefin \
            --build-arg IMAGE_VENDOR=joshyorko \
            --build-arg KERNEL="${kernel_release}" \
            --build-arg UBLUE_IMAGE_TAG=testing \
            --secret id=GITHUB_TOKEN,env=GITHUB_TOKEN \
            --tag localhost/bluefin-rpmdb-base-common .
      - name: Verify base-common RPMDB
        shell: bash
        run: |
          set -euo pipefail
          podman run --rm --entrypoint /usr/bin/rpmdb localhost/bluefin-rpmdb-base-common --verifydb
          podman run --rm --entrypoint /usr/bin/rpm localhost/bluefin-rpmdb-base-common -qa >/dev/null
